<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page not built yet | Professor Eric Lim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A1E36;--blue:#1B5FA8;--blue-deep:#134A86;--sky:#9CC3EA;--sky-light:#BBD9F2;--porcelain:#F5F7FA;--text:#1F2E3D;--text-soft:#5A6B7D;--line:#E3E9F0;--serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',-apple-system,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);color:var(--text);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.container{max-width:1180px;margin:0 auto;padding:0 40px;}
@media(max-width:720px){.container{padding:0 22px;}}
.hero{background:var(--ink);padding:90px 0 96px;}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--sky);margin-bottom:20px;}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(34px,4.4vw,54px);color:#fff;line-height:1.1;}
h1 em{font-style:italic;font-weight:400;color:var(--sky-light);}
.hero p{color:rgba(255,255,255,.75);font-size:17px;max-width:58ch;margin-top:22px;}
main section{padding:64px 0 80px;}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3vw,34px);color:var(--ink);margin-bottom:24px;}
.pages{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:720px){.pages{grid-template-columns:1fr;}}
.pages a{display:block;padding:20px 22px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;background:var(--porcelain);transition:border-color .2s;}
.pages a:hover{border-color:var(--blue);}
.pages strong{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);}
.pages span{font-size:14px;color:var(--text-soft);}
.note{margin-top:28px;font-size:15px;color:var(--text-soft);max-width:70ch;}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="container">
      <p class="eyebrow">drericlim.com · test site</p>
      <h1>This page is <em>not built yet</em></h1>
      <p>It's part of the new site plan but hasn't been designed and approved yet.</p>
    </div>
  </div>
  <section>
    <div class="container">
      <ul class="pages">
        <li><a href="/"><strong>Back to the test site</strong><span>List of pages ready to test</span></a></li>
      </ul>
    </div>
  </section>
</main>
</body>
</html>
