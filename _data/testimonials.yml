    In July 2022 I had been scheduled for lung surgery, the timescale being 4 to 5 weeks. However after five weeks I was told it wasn't going to be for at least another month. At this stage I decided to explore the possibility of private surgery. Extensive research led me to Professor Lim, who I decided was absolutely the right person for the job.

    I made a phone call to his practice manager Maria Leung, who was extremely helpful and efficient and resulted in a consultation appointment for two days later. Following the consultation with Professor Lim, surgery was scheduled for six days later . This was just the outcome I was hoping for. Everything was very straightforward and Maria organised all the preop tests and assessments and admission into the Royal Brompton Hospital. All of this was seamless, stress free and efficient. Beyond my expectations!

    My surgery was via keyhole which was incredible and meant that my recovery after surgery was so quick that I was discharged the next day . I certainly wasn't expecting to be travelling back to Devon 24 hours after surgery.This was entirely due to Professor Lim’s exceptional skills, expertise and experience. Family and friends were just astounded. A week later I travelled back up to London for a follow-up consultation.

    The whole experience of surgery ,care and attention by Professor Lim, Maria and the Royal Brompton Hospital was truly outstanding and I am so very grateful to them all.

