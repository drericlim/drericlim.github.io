    I was referred to Professor Eric Lim after a recommendation from the Royal Free Hospital. At the time, I was very sceptical and had lost trust in surgeons due to a serious complication during a previous procedure. After months of conflicting medical opinions — including advice to remove two lobes of my lung — I was hesitant to proceed with surgery. Professor Lim reviewed my case and confidently reassured me that a less radical approach was possible. His clear communication and empathy gave me the confidence to cancel my scheduled surgery and go with his plan. I'm glad I did. Thanks to Professor Lim and his team, only one lobe was removed, with clear margins. I was discharged after just two nights and recovered well. At follow-up, he again took the time to reassure me that the cancer was gone and I could move on with my life. I’m extremely grateful to Professor Lim and his team. I wanted to recognise Maria Leung as well for her efficient and supportive communication throughout.

