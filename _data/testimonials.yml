  quote: |
    My Mother has been under the care of Professor Eric Lim for the surgical management of a right upper lobe mass discovered in February 2020. Following a rather negative first experience with a local NHS consultant, we made the decision to seek treatment privately. I chose for my Mother to be treated at the Royal Brompton due to the international reputation it upholds as a specialist hospital for the treatment of lung disease. Upon further reading into Professor Lim’s professional background, I felt confident that she would be receiving the leading standard of care within capable hands. I must stress that both my Mother and I have been exceptionally pleased with the care provided by Professor Lim and his team. On numerous occasions Eric has gone above and beyond to assist us, which has made such a difference during this incredibly distressing period of our lives.

    Our first contact was with Maria, Professor Lim’s PA, who deserves the utmost recognition. I am extremely grateful for the level of service and assistance she provides. We have consistently received very prompt correspondence, she always ensures you are kept in the loop and I have even received email replies from her during unsocial hours, which I would never expect but, to me, reflects the dedication she demonstrates to her role. Her organisation and communication skills really reflect the standard of care provided, and I would like her to know that it does not go unnoticed.

    Unfortunately during preoperative investigations it was discovered that my Mother’s cancer was more advanced than we originally suspected. As a result of this discovery, surgery originally scheduled to take place was cancelled and a lung biopsy was organised for the same date. On our morning commute to this appointment we were caught in traffic and running approximately half an hour late. Anxious that the ward may be expecting us, I emailed Maria and also called ahead out of courtesy to apologise and make the staff aware. Upon speaking to the ward staff, Maria had already swiftly passed the message along. This greatly put us at ease and is an example of the outstanding service we have experienced in Professor Lim’s care, given this was around 08:00am and I doubt Maria had even began her working day.

    Whilst waiting for her biopsy to take place, Professor Lim arrived on the ward and sat with us in the waiting room to have a chat and reflect upon our discussions from the day before. Considering that my Mother’s surgery was cancelled due to the advancement of her cancer, this was a very humanising approach and was much appreciated. He took the time to ensure we understood all of the information and was aware of the plan moving forward. I can say with confidence that this made such a difference for my Mother, as she was extremely distressed at the prospect of having a biopsy whilst awake and had been upset on the journey to the hospital. I will be forever grateful for that.

    My Mother is now receiving on-going oncology input at St Barts Hospital, which Professor Lim personally and very kindly assisted us in organising so that she could have access to clinical trials. Hopefully if this progresses well, we will reconvene with Eric in the near future to discuss the possibility of surgery once again. It is an appointment that my Mother and I are looking forward to and provides us with a goal to aim for. So for anyone looking for an experienced and professional surgeon with a genuine desire to make a difference for each and every individual, please do not hesitate to look any further than Professor Lim.

