- name: "Tracy Gooding"
  year: 2021
  treatment: ""
  photo: ""
  homepage: no
  quote: |
    A ground glass lesion in my right lung had been discovered by CT scan. The British guidelines were that I was put on a surveillance program which meant repeat CT scans at 3 months.

    I was a Nurse for 28 years and in that time I had nursed many patients who had poor health and worse health outcomes because their particular health problem had been categorised as one that could be monitored at specific intervals.

    I also knew my own self and that I would find a surveillance program too stressful. I had private health care which meant I could see a specialist of my choosing.

    Professor Lim was recommended to me by my local chest physician. I researched him and was pleased to discover that he focuses on patients being able to make their own clinical decisions.

    All too often a patient is categorised by their condition and are not able to participate in decision making, but are told what is going to happen to them , how and when.

    I met Professor Lim him over a zoom call during which the findings were discussed and my options explained. I wanted to have the lesion removed as I felt I would cope better psychologically if it was dealt with soon. Refreshingly he agreed this would be what he would have wanted and was fully supportive of my decision.

    I cannot express how happy I am that the surgery went ahead just 3 weeks later. My lesion turned out to be adenocarcinoma in situ (lung cancer). The good news is that it has all been removed and I don’t need any further treatment.

    The operation caused very little pain. I only needed regular paracetamol after the operation. My wound has healed well and the mild swelling is subsiding. I was looked after by Professor Lim's team with the upmost care and attention.

    But, here's the thing, if I had been put on a surveillance program, my cancer may have progressed. I could potentially have become symptomatic and my life could have been shortened. I truly believe that being able to be involved in the clinical decision making has given me a longer life.

    It is my hope that one day all patients are involved in every aspect of decision making around their care. We are individuals. We are not just a condition.

