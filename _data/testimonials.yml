- name: "Gaye Bentham"
  year: 2023
  treatment: ""
  photo: ""
  homepage: no
  quote: |
    In December 2022, I was diagnosed with lung cancer after a routine chest X ray showed a suspicious nodule in my upper left lobe. I saw a number of doctors in the Middle East, where I live, and the general consensus was that I would need to undergo a lobectomy, i e, removal of the entire upper lobe. Surgery was scheduled for January 19 but I was searching for any alternative to this drastic measure. After a lot of Googling, I came across Professor Lim and decided then and there that this would be the best option, if he would take me on. I sent an enquiry to the Royal Brompton and the same day received a response from Maria Leung, Professor Lim’s personal assistant, who arranged a video consultation with Professor Lim. He explained the procedure in detail, highlighted the potential risks and confirmed that he could perform the surgery within the next couple of weeks. After that, things moved at the speed of light - I flew to London and underwent a VATS segmentectomy on January 31. In the recovery room, Professor Lim came to tell me that he only needed to take one quarter of the top lobe, and that all the cancer was gone and the lymph nodes clear. And all achieved through just one small incision! A few days later I was discharged, with very little pain - which was managed with paracetamol. On Day 4 I went for a 3km walk. I have no words to express my deep gratitude to Professor Lim, and all his team, for this magnificent outcome.

    Not only is Professor Lim a brilliant and extremely skilled surgeon (he pioneered the single incision keyhole surgery), but he is a humble and kind man who genuinely cares about the comfort of his patients, and aims to deliver the best treatment with the least amount of pain. He heads up a tight and talented team, who all work together to ensure the very best care for the patient. A special mention to his dedicated and hardworking assistant, Maria Leung, who was incredibly efficient and helpful, even answering queries late at night and the weekends. Hats off to all of you! The Royal Brompton hospital was also great and their nursing team took good care of me - and the food was first class.

    I feel extremely privileged and grateful that I had this opportunity to be operated on by one of the best in the world. Thank you a thousand times over - I will never forget you.

