  quote: |
    Being stuck on an NHS waiting list for lung surgery in the midst of a COVID-19 pandemic in December 2021 was far from ideal, particularly as I was getting repeated severe chest infections and needing to posturally drain my lung on a daily basis. The underlying diagnosis was uncertain, but CT scans had revealed extensive, fluid-filled cavities in my right lower lobe, suggestive of cystic bronchiectasis with severe chronic infection.

    I took matters into my own hands and researched my options in terms of thoracic surgery. Professor Lim stood out on many levels, but particularly as a pioneer in the development of Video Assisted Thoracoscopic Surgery (VATS) via a single incision. I knew he was the man for the job but had no idea how I could make it happen.

    A tentative initial phone enquiry from me was answered by Maria Leung, Prof Lim’s Practice Manager. She was simply outstanding in every way and, if not for her initiative, tenacity and genuine willingness to help, I believe my outcome would have been very different.

    Following my call, she took the initiative to request my scans and test results and show them to Prof Lim and, within 48 hours, a zoom consultation had been held, a self-funder fee negotiated and a date for surgery set for the following week.

    To make surgery happen at a time when wards were being shut every day at The Royal Brompton due to COVID was exceptionally challenging but Team Lim would not be defeated.

    Surgery proved that their urgency in getting the operation booked in before Christmas was not misplaced and, despite being faced with a hugely distended lung lobe, filled with pus and on the point of rupture, Prof Lim managed to drain and then remove it via a single incision. A truly remarkable feat!

    The level of medical care at The Royal Brompton Hospital was exceptional, with Prof Lim even coming in on Christmas Day to oversee my recovery from a post-operative complication.

    Pain management was outstanding and, five months later, I am back working full time and swimming several times a week.

    Prof Lim, Maria and the rest of the team… you are simply the best!

