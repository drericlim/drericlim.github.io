# Publications shown on /publications (For professionals > Research > Publications).
#
# DRAFT v0.1, 29 October 2026: a SAMPLE of about a dozen papers, written from memory
# to show the layout. Titles, journals, years, authors and DOIs still need checking
# against ORCID (orcid.org/0000-0002-9078-3226). The full list of 200+ papers will
# replace this sample once it has been exported from ORCID or PubMed.
#
# One block per paper. Fields:
#   title:     the paper's title, as published
#   authors:   first three authors then "et al." (Lim E is shown in bold automatically)
#   journal:   the journal's full name
#   year:      year of publication (number)
#   type:      one of: Randomised trial, Protocol, Guideline, Original research,
#              Meta-analysis, Review, Editorial, Letter, Report
#   category:  the slug of a category in _data/publication_categories.yml
#   doi:       the DOI only, e.g. 10.1136/thx.2010.145938 (the page makes the link)
#   featured:  true to show it in "Selected publications" at the top (keep to 6 to 8)
#   note:      one plain-English line on why it matters (featured papers only)
#
# Newest first within each category is done by the page, so order here does not matter.
# To add a paper: ask Claude ("Please add this paper to my publications list" with the
# DOI or PubMed link), or copy a block and fill it in.

